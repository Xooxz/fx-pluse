server:
  port: 8081

spring:
  application:
    name: fx-stream-service
  profiles:
    active: local

  reactor:
    context-propagation: auto

  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

management:
  endpoints:
    web:
      exposure:
        include: health,info

  tracing:
    sampling:
      probability: 1.0

  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

# local
---
spring:
  config:
    activate:
      on-profile: local

  data:
    redis:
      host: localhost
      port: 16379
      password: fx_steam12!@
      database: 0

  r2dbc:
    url: r2dbc:postgresql://localhost:15432/fx_stream
    username: fx_user
    password: fx_stream12!@

    pool:
      enabled: true
      initial-size: 1
      max-size: 10
      max-idle-time: 30m
      validation-query: SELECT 1

  flyway:
    enabled: true
    url: jdbc:postgresql://localhost:15432/fx_stream
    user: fx_user
    password: fx_stream12!@
    locations: classpath:db/migration